<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img" aria-label="ALP Bio ADA benchmark dashboard preview">
  <defs>
    <style>
      .bg { fill:#f7faf9; }
      .panel { fill:#ffffff; stroke:#d7e2df; stroke-width:1.1; }
      .card { fill:#ffffff; stroke:#d7e2df; stroke-width:1.1; }
      .claim { fill:#fbfdfc; stroke:#d7e2df; stroke-width:1.1; }
      .title { font:760 30px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#10201c; }
      .sub { font:420 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#475569; }
      .label { font:700 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#1f2937; }
      .caption { font:500 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#64748b; }
      .small { font:650 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#64748b; }
      .metric { font:780 29px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#0f172a; }
      .rank { font:760 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#0f766e; }
      .claimtext { font:650 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#14211e; }
      .mono { font:700 12px ui-monospace,SFMono-Regular,Menlo,monospace; fill:#334155; }
    </style>
  </defs>
  <rect class="bg" width="1120" height="700"/>
  <rect class="panel" x="28" y="28" width="1064" height="644" rx="8"/>
  <text class="title" x="64" y="76">ADA Generalization Bench</text>
  <text class="sub" x="64" y="108"><tspan x="64" dy="0">An open, reproducible retrospective benchmark for predicting clinical anti-drug</tspan><tspan x="64" dy="22">antibody rates on FDA-approved monoclonal antibodies. The output is a partner-facing</tspan></text>
  <rect class="card" x="64" y="166" width="232" height="84" rx="8"/>
  <text class="small" x="84" y="194">pressure index</text>
  <text class="metric" x="84" y="230">0.3167</text>
  <rect class="card" x="320" y="166" width="232" height="84" rx="8"/>
  <text class="small" x="340" y="194">evidence density</text>
  <text class="metric" x="340" y="230">18.75</text>
  <rect class="card" x="576" y="166" width="480" height="84" rx="8"/>
  <text class="small" x="596" y="194">partner-facing claim under test</text>
  <text class="label" x="596" y="224"><tspan x="596" dy="0">single evidence replay</tspan></text>
  <rect class="card" x="64" y="292" width="482" height="338" rx="8"/>
  <text class="label" x="92" y="322">blind-set benchmark gates</text>
  <text x="92" y="358" class="label">single coverage</text><text x="455" y="358" class="mono">ev_0132</text><rect x="92" y="370" width="390" height="14" rx="7" fill="#e5e7eb"/><rect x="92" y="370" width="366" height="14" rx="7" fill="#0f766e"/><text x="92" y="408" class="caption">single evidence replay</text><text x="92" y="424" class="label">important risk</text><text x="455" y="424" class="mono">ev_0055</text><rect x="92" y="436" width="390" height="14" rx="7" fill="#e5e7eb"/><rect x="92" y="436" width="364" height="14" rx="7" fill="#4f46e5"/><text x="92" y="474" class="caption">pharma operator packet</text><text x="92" y="490" class="label">question precision</text><text x="455" y="490" class="mono">ev_0066</text><rect x="92" y="502" width="390" height="14" rx="7" fill="#e5e7eb"/><rect x="92" y="502" width="362" height="14" rx="7" fill="#b45309"/><text x="92" y="540" class="caption">question regression harness</text><text x="92" y="556" class="label">pharma latency</text><text x="455" y="556" class="mono">ev_0077</text><rect x="92" y="568" width="390" height="14" rx="7" fill="#e5e7eb"/><rect x="92" y="568" width="362" height="14" rx="7" fill="#2563eb"/><text x="92" y="606" class="caption">important boundary probe</text>
  <text class="label" x="622" y="324">BD claims must carry evidence IDs</text>
  <rect class="claim" x="622" y="350" width="212" height="116" rx="8"/><text class="rank" x="640" y="378">claim 1</text><text class="claimtext" x="640" y="406"><tspan x="640" dy="0">block release until</tspan><tspan x="640" dy="17">cited evidence is</tspan><tspan x="640" dy="17">regenerated</tspan></text><text class="mono" x="640" y="450">ev_0132</text><rect class="claim" x="864" y="350" width="212" height="116" rx="8"/><text class="rank" x="882" y="378">claim 2</text><text class="claimtext" x="882" y="406"><tspan x="882" dy="0">accept only if decision</tspan><tspan x="882" dy="17">claims cite fixture</tspan><tspan x="882" dy="17">evidence</tspan></text><text class="mono" x="882" y="450">ev_0055</text><rect class="claim" x="622" y="492" width="212" height="116" rx="8"/><text class="rank" x="640" y="520">claim 3</text><text class="claimtext" x="640" y="548"><tspan x="640" dy="0">open a regression issue</tspan><tspan x="640" dy="17">with trace and benchmark</tspan><tspan x="640" dy="17">delta</tspan></text><text class="mono" x="640" y="592">ev_0066</text><rect class="claim" x="864" y="492" width="212" height="116" rx="8"/><text class="rank" x="882" y="520">claim 4</text><text class="claimtext" x="882" y="548"><tspan x="882" dy="0">route to reviewer with</tspan><tspan x="882" dy="17">evidence packet</tspan></text><text class="mono" x="882" y="592">ev_0077</text>
</svg>
